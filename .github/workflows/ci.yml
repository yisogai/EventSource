name: CI

on:
  push:
    branches: [master, "feature/**", "maintenance/**"]
  pull_request:
  workflow_dispatch:

jobs:
  spm-test:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-test-${{ runner.os }}-${{ hashFiles('Package.swift') }}
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test

  spm-test-tsan:
    name: swift test + Thread Sanitizer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test with TSan
        run: swift test --sanitize=thread
        env:
          SWIFT_DETERMINISTIC_HASHING: 1

  ios-test:
    name: xcodebuild test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The xcodeproj shadows the package and its auto-generated package
      # scheme has no test action, so the package is tested from a directory
      # of its own.
      - name: Test on iOS Simulator (package only)
        run: |
          PKGDIR="$RUNNER_TEMP/pkg"
          mkdir -p "$PKGDIR"
          cp -R Package.swift Sources Tests "$PKGDIR/"
          cd "$PKGDIR"
          xcodebuild test -scheme EventSource \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

  platform-builds:
    name: build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: ["tvOS Simulator", "watchOS Simulator", "visionOS Simulator"]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build library
        run: >
          xcodebuild build
          -project EventSource.xcodeproj
          -scheme EventSource
          -destination 'generic/platform=${{ matrix.platform }}'
          CODE_SIGNING_ALLOWED=NO

  example-build:
    name: build Example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build Example
        run: >
          xcodebuild build
          -project EventSource.xcodeproj
          -scheme Example
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
